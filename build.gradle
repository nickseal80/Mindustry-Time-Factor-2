apply plugin: "java"

version = '1.0'

sourceSets.main.java.srcDirs = ["src"]

repositories{
    mavenCentral()
    maven{ url = "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven{ url = 'https://www.jitpack.io' }
}

java{
    targetCompatibility = 8
    sourceCompatibility = JavaVersion.VERSION_17
}

ext{
    //the build number that this mod is made for
    mindustryVersion = 'v154.3'
    jabelVersion = "93fde537c7"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

//java 8 backwards compatibility flag
allprojects{
    tasks.withType(JavaCompile).tap{
        configureEach{
            options.compilerArgs.addAll(['--release', '8'])
        }
    }
}

dependencies{
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    annotationProcessor "com.github.Anuken:jabel:$jabelVersion"
}

//force arc version
configurations.configureEach{
    resolutionStrategy.eachDependency { details ->
        if(details.requested.group == 'com.github.Anuken.Arc'){
            details.useVersion "$mindustryVersion"
        }
    }
}

tasks.register('jarAndroid'){
    dependsOn "jar"

    doLast{
        if(!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }

        if(!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        //collect dependencies needed for desugaring
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")

        def d8 = isWindows ? "d8.bat" : "d8"

        //dex and desugar files - this requires d8 in your PATH
        "$d8 $dependencies --min-api 14 --output timeFactorAndroid.jar timeFactorDesktop.jar"
                .execute(null, new File("build/libs")).waitForProcessOutput(System.out, System.err)
    }
}

jar{
    archiveFileName = "timeFactorDesktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
    }

    from("assets/"){
        include "**"
    }
}

tasks.register('deployAndroid', Jar){
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "timeFactor.jar"

    from{ [zipTree("build/libs/timeFactorDesktop.jar"), zipTree("build/libs/timeFactorAndroid.jar")] }

    doLast{
        delete{
            delete "build/libs/timeFactorAndroid.jar"
        }
    }
}

tasks.register('deploy') {
    dependsOn jar
    doLast {
        // Путь к папке модов в Windows
        def modsDir = System.getenv('APPDATA') + '\\Mindustry\\mods'

        // Создаем папку, если её нет
        file(modsDir).mkdirs()

        // Копируем JAR
        def sourceFile = file("build/libs/timeFactorDesktop.jar")
        def targetFile = file("$modsDir/timeFactorDesktop.jar")

        println "Копирование мода в: $targetFile"
        copy {
            from sourceFile
            into modsDir
            rename { "timeFactor.jar" }
        }

        println "✅ Мод скопирован! Запустите Mindustry вручную."
    }
}

tasks.register('run', JavaExec) {
    // Главный класс игры
    mainClass = 'mindustry.desktop.DesktopLauncher'

    // Classpath: ваш код + зависимости (Arc, Jabel)
    classpath = sourceSets.main.runtimeClasspath

    // Рабочая директория (где игра будет искать ресурсы)
    workingDir = file("$buildDir/run")

    // Создаём папку для ресурсов
    doFirst {
        workingDir.mkdirs()
    }

    // Выделяем память
    jvmArgs '-Xmx1024m'
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:-options']
}
